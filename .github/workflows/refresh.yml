name: Refresh dashboards

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC (= Iceland time)
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # to commit the snapshots in data/snapshots/ (bank shareholder lists, alcohol prices)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      send_anonymous_usage_stats: "no"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboards/package-lock.json

      # Keep the raw zone between runs: if a source is down (e.g. Hagstofa rate-limits),
      # the extract step falls back on yesterday's files instead of failing.
      - name: Restore raw data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Install
        run: |
          uv sync --frozen
          npm ci --prefix dashboards

      # extract → dbt build (tests must pass, so bad data never ships) → lineage docs → Evidence
      - name: Run pipeline
        run: make refresh

      # Sources that only show their current state are snapshotted to build up history:
      # Íslandsbanki's and Arion's shareholder lists (monthly) and alcohol prices (daily change
      # log). Pushes made with GITHUB_TOKEN don't trigger another workflow run.
      - name: Commit snapshots
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add data/snapshots
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Snapshot shareholder lists and alcohol prices $(date -u +%Y-%m-%d)"
            git push
          fi

      # `pages deploy` doesn't create the project, so make sure it exists (no-op after the first run).
      - name: Ensure Cloudflare Pages project exists
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list | grep -q "arctic-dashboards" \
            || npx --yes wrangler@4 pages project create arctic-dashboards --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboards/build --project-name=arctic-dashboards --branch=main --commit-dirty=true
