version: 2

seeds:
  - name: regions
    description: The eight regions (landshlutar) used across sources, with a representative Veðurstofa weather station for each.
    columns:
      - name: region_key
        tests: [unique, not_null]
      - name: name_is
        tests: [unique, not_null]
      - name: station_id
        tests: [unique, not_null]

  - name: pension_funds
    description: Pension funds and bank custodians of private pension savings, with URL slugs for the per-fund dashboard pages.
    columns:
      - name: fund_key
        tests: [unique, not_null]
      - name: slug
        tests: [unique, not_null]

  - name: pension_fund_names
    description: Every fund name as spelled in the Central Bank files (quarterly and annual, all years) → fund_key. New or renamed funds must be added here or the build fails.
    columns:
      - name: raw_name
        tests: [unique, not_null]
      - name: fund_key
        tests:
          - relationships:
              arguments: {to: ref('pension_funds'), field: fund_key}

  - name: asset_classes
    description: Asset class names from the Central Bank's quarterly breakdown (the legal categories A.a–F.b of the pension act, plus the older 2017 names) → one harmonised asset class and a coarse asset group.
    columns:
      - name: raw_name
        tests: [unique, not_null]
      - name: asset_group
        tests:
          - relationships:
              arguments: {to: ref('asset_groups'), field: asset_group}

  - name: asset_groups
    description: Coarse asset groups used for the high-level mix (bonds, deposits, equities, funds, other).
    columns:
      - name: asset_group
        tests: [unique, not_null]

  - name: pension_fund_owners
    config:
      column_types: {owner_id: varchar, fund_key: varchar, division_label: varchar, is_pension: boolean, note: varchar}
    description: Kennitala of every pension fund (or division) that appears as a registered owner in Nasdaq CSD's top-20 lists → fund_key. Owners that merely look like pension funds are listed with is_pension = false.
    columns:
      - name: owner_id
        tests: [unique, not_null]
      - name: fund_key
        tests:
          - relationships:
              arguments: {to: ref('pension_funds'), field: fund_key}

  - name: listed_companies
    config:
      column_types: {isin: varchar, ticker: varchar, name: varchar, note: varchar}
    description: Listed companies in Nasdaq CSD's monthly top-20 report, keyed by ISIN (tickers change, e.g. VIS → SKAGI, REGINN → HEIMAR, OLGERD → BERA).
    columns:
      - name: isin
        tests: [unique, not_null]


  - name: alcohol_stores
    description: Alcohol retailers covered by the Áfengi dashboard (keys as in extract/sources.yml).
    columns:
      - name: store
        tests: [unique, not_null]

  - name: alcohol_category_map
    description: >
      The shops' own category names and tags (lower case) → one common category. A product can carry several
      (Shopify type + tags); the one with the lowest priority wins. "(ekki með)" leaves the product out
      (gift wrapping, non-alcoholic). Products with no mapped category fall back on keywords in the name and ABV.
    columns:
      - name: raw_category
        tests: [unique, not_null]
      - name: category
        tests: [not_null]

  - name: alcohol_match_overrides
    description: >
      Manual fixes to the automatic product matching: a store product → the Vínbúðin product it is
      (vinbudin_product_id), or empty to never match it.
    config:
      column_types: {store: varchar, store_product_id: varchar, vinbudin_product_id: varchar, note: varchar}
