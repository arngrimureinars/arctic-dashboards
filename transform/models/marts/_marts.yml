version: 2

models:
  - name: fct_cpi_monthly
    description: Monthly consumer price index since 1988 – level (1988=100), month-on-month and year-on-year change – for the CPI and the CPI excluding housing. Feeds the inflation dashboard.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: month
        tests: [not_null]
      - name: index_value
        description: Index level, May 1988 = 100.
        tests: [not_null]
      - name: change_yoy_pct
        description: Year-on-year change in %, i.e. inflation. Missing for the first 12 months of the series.
        tests:
          - within_range:
              arguments:
                min_value: -20
                max_value: 100

  - name: fct_cpi_category_effects
    description: Top-level COICOP groups (food, housing, transport, ...) with basket weight, monthly change and contribution to the total monthly CPI change.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: weight_pct
        description: Share of the household basket, in %.
      - name: effect_pct_points
        description: Contribution to the total monthly change, in percentage points.

  - name: data_freshness
    description: Last source update (Hagstofa) and last pipeline load per dataset, shown as "last updated" on dashboards.

  - name: dim_region
    description: Regions (landshlutar) with Icelandic/English names and the weather station used for each.
    columns:
      - name: region_key
        tests: [unique, not_null]

  - name: fct_weather_region_monthly
    description: Monthly mean temperature and precipitation per region.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: region_key
        tests:
          - relationships:
              arguments: {to: ref('dim_region'), field: region_key}

  - name: fct_fx_monthly
    description: Monthly ISK per EUR and ISK per USD from the ECB, with the year-on-year change of ISK per EUR (positive = the króna weakened).
    columns:
      - name: month
        tests: [unique, not_null]

  - name: fct_tourism_monthly
    description: National monthly tourism pulse – foreign and Icelandic departures via Keflavík, overnight stays (total and foreign), ISK per EUR, and year-on-year changes. Joins Hagstofa (two tables) and the ECB.
    columns:
      - name: month
        tests: [unique, not_null]
      - name: foreign_departures
        tests:
          - within_range:
              arguments: {min_value: 0, max_value: 1000000}
      - name: stays_total
        tests:
          - within_range:
              arguments: {min_value: 0, max_value: 5000000}

  - name: fct_tourism_region_monthly
    description: Overnight stays per region and month (total, foreign, Icelandic) with the region's mean temperature and precipitation. Joins Hagstofa and Veðurstofa via dim_region.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: region_key
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_region'), field: region_key}

  - name: fct_kef_nationality_monthly
    description: Departing foreign passengers through Keflavík per nationality and month.
    columns:
      - name: id
        tests: [unique, not_null]

