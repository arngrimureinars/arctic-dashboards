version: 2

models:
  - name: fct_cpi_monthly
    description: Monthly consumer price index since 1988 – level (1988=100), month-on-month and year-on-year change – for the CPI and the CPI excluding housing. Feeds the inflation dashboard.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: month
        tests: [not_null]
      - name: index_value
        description: Index level, May 1988 = 100.
        tests: [not_null]
      - name: change_yoy_pct
        description: Year-on-year change in %, i.e. inflation. Missing for the first 12 months of the series.
        tests:
          - within_range:
              arguments:
                min_value: -20
                max_value: 100

  - name: fct_cpi_category_effects
    description: Top-level COICOP groups (food, housing, transport, ...) with basket weight, monthly change and contribution to the total monthly CPI change.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: weight_pct
        description: Share of the household basket, in %.
      - name: effect_pct_points
        description: Contribution to the total monthly change, in percentage points.

  - name: data_freshness
    description: Last source update (Hagstofa) and last pipeline load per dataset, shown as "last updated" on dashboards.

  - name: dim_region
    description: Regions (landshlutar) with Icelandic/English names and the weather station used for each.
    columns:
      - name: region_key
        tests: [unique, not_null]

  - name: fct_weather_region_monthly
    description: Monthly mean temperature and precipitation per region.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: region_key
        tests:
          - relationships:
              arguments: {to: ref('dim_region'), field: region_key}

  - name: fct_fx_monthly
    description: Monthly ISK per EUR and ISK per USD from the ECB, with the year-on-year change of ISK per EUR (positive = the króna weakened).
    columns:
      - name: month
        tests: [unique, not_null]

  - name: fct_tourism_monthly
    description: National monthly tourism pulse – foreign and Icelandic departures via Keflavík, overnight stays (total and foreign), ISK per EUR, and year-on-year changes. Joins Hagstofa (two tables) and the ECB.
    columns:
      - name: month
        tests: [unique, not_null]
      - name: foreign_departures
        tests:
          - within_range:
              arguments: {min_value: 0, max_value: 1000000}
      - name: stays_total
        tests:
          - within_range:
              arguments: {min_value: 0, max_value: 5000000}

  - name: fct_tourism_region_monthly
    description: Overnight stays per region and month (total, foreign, Icelandic) with the region's mean temperature and precipitation. Joins Hagstofa and Veðurstofa via dim_region.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: region_key
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_region'), field: region_key}

  - name: fct_kef_nationality_monthly
    description: Departing foreign passengers through Keflavík per nationality and month.
    columns:
      - name: id
        tests: [unique, not_null]

  - name: dim_pension_fund
    description: Pension funds and bank custodians of private pension savings, with URL slug and whether they appear in the quarterly and annual data.
    columns:
      - name: fund_key
        tests: [unique, not_null]

  - name: fct_pension_assets_quarterly
    description: Pension fund assets (ISK, book value) per quarter, fund, fund type (samtrygging/séreign), division, harmonised asset class and currency. Source – Central Bank quarterly investment breakdown.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: fund_key
        description: Null means a fund name in the source isn't in seeds/pension_fund_names.csv yet.
        tests: [not_null]
      - name: asset_class_key
        description: Null means an asset class name in the source isn't in seeds/asset_classes.csv yet.
        tests: [not_null]

  - name: fct_pension_fund_quarterly
    description: Per quarter, fund and fund type – total assets, share in foreign currency and the coarse asset mix (bonds, deposits, equities, funds, other).
    columns:
      - name: id
        tests: [unique, not_null]
      - name: foreign_share
        tests:
          - within_range:
              arguments: {min_value: 0, max_value: 1}

  - name: fct_pension_key_figures_annual
    description: Annual key figures per fund and division – net assets, net real return (1/5/10-year), members, active members, pensioners, costs as % of average assets and actuarial position.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: fund_key
        tests: [not_null]
      - name: real_return_pct
        tests:
          - within_range:
              arguments: {min_value: -40, max_value: 40}
      - name: actuarial_total_pct
        description: Net assets in excess of total obligations, % (samtrygging only). Values reported in krónur by some funds are dropped.
        tests:
          - within_range:
              arguments: {min_value: -100, max_value: 100}

  - name: fct_pension_fund_annual
    description: Fund-level annual key figures – asset-weighted returns and costs, summed net assets and head counts.
    columns:
      - name: id
        tests: [unique, not_null]

  - name: dim_listed_company
    description: Listed companies covered by Nasdaq CSD's top-20 report (keyed by current ticker; a company can have had several ISINs), with the months they appear.
    columns:
      - name: ticker
        tests: [unique, not_null]

  - name: fct_listed_top20_monthly
    description: Every registered top-20 shareholder per company and month (Nasdaq CSD), with pension funds identified by kennitala.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: company_name
        description: Null means a new ISIN that isn't in seeds/listed_companies.csv yet.
        tests: [not_null]
      - name: pct
        tests:
          - within_range:
              arguments: {min_value: 0, max_value: 100}

  - name: fct_pension_listed_holdings
    description: Pension fund stakes in listed companies per month (divisions summed) – shares, % and change over 12 months. Only stakes large enough to be in a company's top 20.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: fund_key
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_pension_fund'), field: fund_key}

  - name: fct_listed_pension_share
    description: Combined % of each listed company held by pension funds (among its top-20 owners) per month.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: pension_pct
        tests:
          - within_range:
              arguments: {min_value: 0, max_value: 100}


  - name: fct_alcohol_products
    description: >
      Every alcohol product listed today by the covered stores (Vínbúðin, Desma, Vínklúbburinn, Vin.is), one row
      per store and product: common category, bottle size, ABV, price per bottle/can (cases split), price per litre
      and per litre of pure alcohol, and – for bottles Vínbúðin also sells – the price difference from Vínbúðin.
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: product_key
        description: Shared by the same bottle in different stores (int_alcohol_product_match); the Vínbúðin product id where Vínbúðin sells it.
        tests: [not_null]
      - name: store
        tests:
          - relationships:
              arguments: {to: ref('alcohol_stores'), field: store}
      - name: unit_price_isk
        description: Price of one bottle or can in ISK (a case price divided by the units in it).
        tests:
          - not_null
          - within_range:
              arguments: {min_value: 50, max_value: 1000000}
      - name: abv
        description: Alcohol by volume, %. Missing where the shop doesn't state it.
        tests:
          - within_range:
              arguments: {min_value: 0.1, max_value: 80}
      - name: volume_ml
        description: Bottle/can size in ml (Vínbúðin also sells 20–30 l party kegs). Wine without a stated size is taken as 750 ml (volume_assumed).
        tests:
          - within_range:
              arguments: {min_value: 20, max_value: 50000}
      - name: vs_vinbudin_pct
        description: Price compared with the same bottle at Vínbúðin (0.1 = 10 % dearer). Only for matched bottles.

  - name: fct_alcohol_matched
    description: Bottles sold by two or more stores, with each store's price side by side, the cheapest store and the price spread.
    columns:
      - name: product_key
        tests: [unique, not_null]

  - name: fct_alcohol_store_category
    description: Per store and category (category 'Allt' = all together) – number of products, median price and price per litre, and the median price difference from Vínbúðin on the bottles both sell.
    columns:
      - name: store
        tests: [not_null]

  - name: fct_alcohol_price_history
    description: >
      Daily price level per store and category from the price change log (history starts 1 October 2026): median
      difference from Vínbúðin on today's matched bottles, and an index of the store's own prices (first day = 100,
      geometric mean of each product's price relative to its first observed price).

  - name: fct_alcohol_price_changes
    description: Every price change seen since the first snapshot, with the old and new price.
