version: 2

models:
  - name: stg_hagstofa__cpi
    description: CPI in long format, one row per month, index and measure. Month codes like 2026M08 are parsed to dates.
    columns:
      - name: month
        tests: [not_null]
      - name: index_code
        description: "CPI = consumer price index, CPILH = CPI excluding housing."
        tests:
          - accepted_values:
              arguments:
                values: [CPI, CPILH]
      - name: measure
        description: "index, change_M (month-on-month %) or change_A (year-on-year %)."
      - name: value
        tests: [not_null]

  - name: stg_hagstofa__cpi_subindices
    description: CPI sub-indices in long format, one row per month, COICOP category and measure.
    columns:
      - name: month
        tests: [not_null]
      - name: category_code
        tests: [not_null]
      - name: category_level
        description: "0 = total CPI, 1 = top-level COICOP group (01–13), 2+ = sub-groups."

  - name: stg_ecb__fx_monthly
    description: Monthly króna exchange rates from the ECB – ISK per EUR and ISK per USD.
    columns:
      - name: month
        tests: [unique, not_null]
      - name: isk_per_eur
        tests:
          - not_null
          - within_range:
              arguments: {min_value: 50, max_value: 400}

  - name: stg_vedur__weather_monthly
    description: Monthly weather per station – mean temperature (°C) and total precipitation (mm).
    columns:
      - name: station_id
        tests: [not_null]
      - name: month
        tests: [not_null]
      - name: mean_temp_c
        tests:
          - within_range:
              arguments: {min_value: -30, max_value: 30}
      - name: precipitation_mm
        tests:
          - within_range:
              arguments: {min_value: 0, max_value: 2000}


  - name: stg_alcohol__products
    description: Today's products per store with a common category, price per unit and per litre, and normalised names for matching. Non-alcoholic drinks, gift cards, memberships and mystery boxes are left out.
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_alcohol__price_changes
    description: The price change log (data/snapshots/alcohol/), one row per store, product and day its price or stock changed.
