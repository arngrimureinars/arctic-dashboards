version: 2

sources:
  - name: hagstofa
    description: Statistics Iceland (Hagstofa Íslands), pulled from the PxWeb API by extract/hagstofa.py.
    meta:
      external_location: "data/raw/hagstofa/{name}.parquet"
    tables:
      - name: cpi
        description: "VIS01000 – Consumer price index (1988=100) and its monthly/annual changes, for the CPI and the CPI excluding housing."
      - name: cpi_subindices
        description: "VIS01300 – CPI sub-indices by COICOP category: index, weight, monthly change and effect on the total index."
      - name: overnight_stays
        description: "SAM01601 – overnight stays (gistinætur) at all registered accommodation by region, nationality group and month. The newest months are published nationally first; regional figures follow later."
      - name: kef_passengers
        description: "SAM02001 – departing passengers through Keflavík airport by nationality and month (Ferðamálastofa counts)."

  - name: ecb
    description: European Central Bank Data API (SDMX), pulled by extract/ecb.py.
    meta:
      external_location: "data/raw/ecb/{name}.parquet"
    freshness:
      warn_after: {count: 45, period: day}
    loaded_at_field: "_loaded_at"
    tables:
      - name: fx_isk_eur
        description: "EXR/M.ISK.EUR.SP00.A – monthly average ISK per EUR. The ECB series has a gap 2009–2017, so it starts in 2018."
      - name: fx_usd_eur
        description: "EXR/M.USD.EUR.SP00.A – monthly average USD per EUR, used to derive ISK per USD."

  - name: vedur
    description: Veðurstofa Íslands weather API (OGC EDR, monthly collection), pulled by extract/vedur.py.
    meta:
      external_location: "data/raw/vedur/{name}.parquet"
    freshness:
      warn_after: {count: 3, period: day}
    loaded_at_field: "_loaded_at"
    tables:
      - name: weather_monthly
        description: "Monthly mean temperature (t, °C) and precipitation (r09, mm) for one station per region."

  - name: sedlabanki
    description: Central Bank of Iceland (Seðlabanki) – pension fund statistics from its financial supervision, pulled by extract/sedlabanki.py.
    meta:
      external_location: "data/raw/sedlabanki/{name}.parquet"
    tables:
      - name: pension_investments
        description: "Quarterly investment breakdown (Sundurliðun fjárfestinga) per fund, division, legal asset category and currency, in ISK at book value. Q3 2017 onwards."
      - name: pension_annual
        description: "Annual summaries of the funds' financial statements (sheet Gögn) per fund, division and line item – balance sheet, income statement, cash flow and key figures. 2019 onwards."
        meta:
          external_location: "data/raw/sedlabanki/pension_annual_*.parquet"

  - name: nasdaq_csd
    description: Nasdaq CSD Iceland – monthly report on the 20 largest registered shareholders of covered listed companies, pulled by extract/nasdaq_csd.py.
    meta:
      external_location: "data/raw/nasdaq_csd/top20_*.parquet"
    tables:
      - name: top20
        description: "One row per company, month and owner among the 20 largest: shares, total issued, % and the owner's kennitala. February 2022 onwards. Registered (direct) holdings only – beneficial owners behind custody accounts and fund holdings aren't visible."

  - name: bank_shareholders
    description: Owners above 1 % that Íslandsbanki and Arion banki publish on their websites (Act 161/2002, art. 19), snapshotted monthly by extract/bank_shareholders.py – the banks aren't in Nasdaq CSD's top-20 report.
    meta:
      external_location: "data/raw/bank_shareholders/{name}.parquet"
    tables:
      - name: owners
        description: "One row per bank, snapshot and owner above 1 %: shares, % and kennitala where the bank links it. History starts September 2026."

