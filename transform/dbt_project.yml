name: arctic
version: "1.0.0"
profile: arctic

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  arctic:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  arctic:
    +schema: reference

flags:
  # Also keeps dbt's usage tracker out of the published docs site (/lineage).
  send_anonymous_usage_stats: false
